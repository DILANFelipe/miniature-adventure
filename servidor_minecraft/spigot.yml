config-version: 8
messages:
  whitelist: '&6&l&nÂ¡MANTENIMIENTO! &e(discord.gg/hycube)'
  unknown-command: '&8(&6&lSURVIVAL&8) &8&lâ–¸ &fÂ¡Comando no encontrado!'
  server-full: '&6&lÂ¡MODALIDAD LLENA! &e(tienda.hycube.es)'
  outdated-client: '&fÂ¡No puedes entrar con esa versiÃ³n! &6&n(1.8 - 1.20)'
  outdated-server: '&fÂ¡No puedes entrar con esa versiÃ³n! &6&n(1.8 - 1.20)'
  restart: '&6Â¡Reiniciando, vuelve a entrar!'
stats:
  disable-saving: false
  forced-stats: {}
commands:
  tab-complete: 0
  log: true
  spam-exclusions:
  - /skill
  silent-commandblock-console: false
  replace-commands:
  - setblock
  - summon
  - testforblock
  - tellraw
  send-namespaced: true
settings:
  moved-too-quickly-threshold: 100.0
  bungeecord: false
  late-bind: true
  sample-count: 12
  player-shuffle: 0
  filter-creative-items: true
  user-cache-size: 1000
  save-user-cache-on-stop-only: true
  int-cache-limit: 1024
  moved-wrongly-threshold: 0.0625
  timeout-time: 60
  restart-on-crash: true
  restart-script: ./start.sh
  netty-threads: 4
  attribute:
    maxHealth:
      max: 2048.0
    movementSpeed:
      max: 2048.0
    attackDamage:
      max: 2048.0
  debug: false
  moved-too-quickly-multiplier: 10.0
  log-villager-deaths: true
  log-named-deaths: true
timings:
  enabled: true
  verbose: true
  server-name-privacy: false
  hidden-config-entries:
  - database
  - settings.bungeecord-addresses
  history-interval: 300
  history-length: 3600
world-settings:
  default:
    verbose: true
    nerf-spawner-mobs: true
    anti-xray:
      enabled: false
      engine-mode: 1
      hide-blocks:
      - 14
      - 15
      - 16
      - 21
      - 48
      - 49
      - 52
      - 54
      - 56
      - 73
      - 74
      - 82
      - 129
      - 130
      replace-blocks:
      - 1
      - 5
    mob-spawn-range: 3
    growth:
      cactus-modifier: 100
      cane-modifier: 100
      melon-modifier: 100
      mushroom-modifier: 100
      pumpkin-modifier: 100
      sapling-modifier: 100
      wheat-modifier: 100
      netherwart-modifier: 100
    entity-activation-range:
      animals: z
      monsters: 18
      misc: 4
    entity-tracking-range:
      players: 48
      animals: 48
      monsters: 48
      misc: 32
      other: 64
    ticks-per:
      hopper-transfer: 44
      hopper-check: 44
    hopper-amount: 4
    random-light-updates: false
    save-structure-info: true
    max-bulk-chunks: 10
    max-entity-collisions: 2
    dragon-death-sound-radius: 0
    seed-village: 10387312
    seed-feature: 14357617
    hunger:
      walk-exhaustion: 0.2
      sprint-exhaustion: 0.8
      combat-exhaustion: 0.3
      regen-exhaustion: 3.0
    max-tnt-per-tick: 100
    max-tick-time:
      tile: 1000
      entity: 1000
    item-despawn-rate: 3000
    merge-radius:
      item: 4.0
      exp: 6.0
    arrow-despawn-rate: 300
    view-distance: 8
    enable-zombie-pigmen-portal-spawns: true
    wither-spawn-sound-radius: 0
    hanging-tick-frequency: 100
    zombie-aggressive-towards-villager: true
    chunks-per-tick: 650
    clear-tick-list: false
    below-zero-generation-in-existing-chunks: true
advancements:
  disable-saving: false
  disabled:
  - minecraft:story/disabled
players:
  disable-saving: false
