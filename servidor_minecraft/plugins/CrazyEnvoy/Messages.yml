#Tips
#1. Make sure to use the %prefix% to add the prefix in front of messages.
#2. If you wish to use more then one line for a message just go from a line to a list.
#Examples:
#  Line:
#    No-Permission: '&8(&e&lSURVIVAL&8) &8&l▸ &fComando no encontrado.'
#  List:
#    No-Permission:
#      - '&c&lSURVIVAL ▸ &fComando no encontrado.'
Messages:
  No-Permission: '&8(&e&lSURVIVAL&8) &8&l▸ &fComando no encontrado.'
  Players-Only: '%prefix%&cOnly players can use that command.'
  Not-Online: '%prefix%&cThat player is not online at this time.'
  Not-A-Number: '%prefix%&cThat is not a number.'
  Reloaded: '%prefix%&fYou have just reloaded all the files.'
  Already-Started: '%prefix%&f¡Hay un evento activo!'
  Force-Start: '%prefix%&f¡Han aparecido tesoros, usa &6/tesoros!'
  Not-Started: '%prefix%&cThere is no crazyenvoy event going on at this time.'
  Force-Ended: '%prefix%&cYou have just ended the crazyenvoy.'
  Warning: '&8(&6&lTESOROS&8) &8&l▸ &f¡Van a aparecer tesoros en &6%time%!'
  Started: '&8(&6&lTESOROS&8) &8&l▸ &f¡Han aparecido tesoros, usa &6/tesoros!'
  Left: '%prefix%&6%player% &fencontro un tesoro, quedan: &6%amount%'
  Ended: '%prefix%&f¡Han encontrado todos los tesoros!'
  Not-Enough-Players: '&8(&6&lTESOROS&8) &8&l▸ &f¡No hay suficientes jugadores!'
  Enter-Editor-Mode: '%prefix%&fYou are now in editor mode.'
  Leave-Editor-Mode: '%prefix%&fYou have now left editor mode.'
  Kicked-From-Editor-Mode: '%prefix%&cSorry but an crazyenvoy is active. Please stop it or wait till it''s over.'
  Add-Location: '%prefix%&fYou have just added a spawn location.'
  Remove-Location: '%prefix%&cYou have just removed a spawn location.'
  Time-Left: '&8(&6&lTESOROS&8) &8&l▸ &f¡Faltan pocos tesoros por encontrar!'
  Time-Till-Event: '&8(&6&lTESOROS&8) &8&l▸ &f!Los tesoros aparecerán en &6%time%!'
  Used-Flare: '%prefix%&f¡Han usado un invocador de tesoros!'
  Cant-Use-Flares: '%prefix%&cYou do not have permission to use flares.'
  Give-Flare: '%prefix%&fYou have just given &6%player% %amount% &fflares.'
  Given-Flare: '%prefix%&f¡Has recibido &6%amount% &finvocador de &6&ltesoros!'
  New-Center: '%prefix%&fYou have just set a new center for the random crazyenvoy crates.'
  Not-In-World-Guard-Region: '%prefix%&cYou must be in the WarZone to use a flare.'
  Start-Ignoring-Messages: '%prefix%Ahora estás ignorando los mensajes de los tesoros.'
  Stop-Ignoring-Messages: '%prefix%Ahora ves todos los mensajes de los tesoros.'
  Cooldown-Left: '%prefix%&fYou still have &6%time% &ftill you can collect another crate.'
  Drops-Available: '%prefix%&fList of all available envoys.'
  Drops-Possibilities: '%prefix%&fList of location crazyenvoy''s may spawn at.'
  Drops-Page: '%prefix%&fUse /crazyenvoy drops [page] to see more.'
  Drops-Format: '&f[&6%id%&f]: %world%, %x%, %y%, %z%'
  No-Spawn-Locations-Found: '%prefix%&cNo spawn locations were found and so the event has been cancelled and the cooldown has been reset.'
  Hologram-Placeholders:
    On-Going: 'On Going'
    Not-Running: 'Not Running'
  Help:
    - '&6/envoy help &f- Shows the envoy help menu.'
    - '&6/envoy reload &f- Reloads all the config files.'
    - '&6/envoy time &f- Shows the time till the envoy starts or ends.'
    - '&6/envoy drops [page] &f- Shows all current crate locations.'
    - '&6/envoy ignore &f- Shuts up the envoy collecting message.'
    - '&6/envoy flare [amount] [player] &f- Give a player a flare to call an envoy event.'
    - '&6/envoy edit &f- Edit the crate locations with bedrock.'
    - '&6/envoy start &f- Force starts the envoy.'
    - '&6/envoy stop &f- Force stops the envoy.'
    - '&6/envoy center &f- Set the center of the random crate drops.'