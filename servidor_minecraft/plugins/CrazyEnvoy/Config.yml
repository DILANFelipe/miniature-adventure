Settings:
  Prefix: '&8(&6&lTESOROS&8) &8&l▸ &f' #The prefix before the messages CrazyEnvoys sends.
  Toggle-Metrics: true #Turn on and off if your server stats are sent to https://bstats.org/plugin/bukkit/CrazyEnvoy.
  Falling-Block-Toggle: false #Toggle if it spawns a falling block or if the crates just appear.
  Falling-Block: '0' #The block that will be falling.
  Fall-Height: 0 #How high the falling blocks spawn.
  Max-Crate-Toggle: true #If true then only a specified amount of crates will spawn and if false then all crates will spawn.
  Max-Crates: 500 #The max amount of crates that will spawn.
  Random-Locations: false #If true you will need to make sure to set the center location.
  Max-Radius: 350 #The maximum distance the crates will fall from the center.
  Min-Radius: 8 #The minimum distance from the middle the crates will fall from.
  Envoy-Run-Time: '59m' #The amount of time the crazyenvoy event will go for.
  Envoy-Timer-Toggle: true #If the crazyenvoy will happen on an interval. If false the only wait it will start is if its started with the command or flare.
  Envoy-Cooldown-Toggle: true #Toggle if it uses a cooldown or a specified time of the day.
  Envoy-Cooldown: '180m' #The time till the crazyenvoy event will happen again.
  Envoy-Time: '7:00 AM' #A specified time of the day that an crazyenvoy will happen. Please use 1-12 for hours and 0-59 for minutes.
  Minimum-Players-Toggle: true #When the crazyenvoy is about to start toggle if there needs to be a minimum amount of players. (Does not affect flares)
  Minimum-Flare-Toggle: false #Toggle if using a flare has to meet the minimum players requirement. Minimum-Players-Toggle must be true for this to work.
  Minimum-Players: 1 #The minimum amount of players needed to start the crazyenvoy.
  Broadcast-Crate-Pick-Up: true #Toggle if when a player gets a crate if it broadcasts the message.
  Crate-Collect-Cooldown: #If when a player collects a crate if they have to wait to collect another.
    Toggle: false #Toggle this option on and off.
    Time: '15s' #The time till they have to wait.
  World-Messages:
    Toggle: false #Toggle if the broadcast messages are only in a specific worlds.
    Worlds: #The worlds you wish to have the messages only show up in.
      - 'world'
  Envoy-Warnings: #The times that will make the warning messages.
    - '60m'
    - '45m'
    - '30m'
    - '20m'
    - '15m'
    - '14m'
    - '13m'
    - '12m'
    - '11m'
    - '10m'
    - '9m'
    - '8m'
    - '7m'
    - '6m'
    - '5m'
    - '3m'
    - '1m'
    - '30s'
    - '20s'
    - '10s'
    - '5s'
    - '3s'
    - '1s'
  Flares: #Options about flares. Players need the crazyenvoy.flare.use permission to use the flares.
    Item: '76' #The time the flares are.
    Name: '&6▪ &lINVOCADOR &7&n(Tesoros)' #The name of the flare.
    Lore: #The lore of the flare.
      - '&8Información'
      - '&f'
      - '&fActiva el evento de tesoros'
      - '&fen todo el servidor, en el'
      - '&fmomento que tu quieras.'
      - '&f'
      - '&6(Haz click der-izq para usar)'
    World-Guard: #The options for when using world guard regions to make flares work only in those regions.
      Toggle: false #If they have to use flares in specified regions.
      Regions: #The name of the regions you can use flares in.
        - 'WarZone'