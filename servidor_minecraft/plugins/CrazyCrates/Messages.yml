  Help:
    - '&3&lCrazy Crates Help Menu'
    - '&6/key [player] &f- Check the number of keys a player has.'
    - '&6/cc &f- Opens the GUI.'
    - '&6/cc additem <crate> <prize> &f- Add items in-game to a prize in a crate.'
    - '&6/cc admin &f- Opens the Admin Keys GUI.'
    - '&6/cc preview <crate> [player] &f- Opens the preview of a crate for a player.'
    - '&6/cc list &f- Lists all the Crates.'
    - '&6/cc open <crate> [player] &f- Tries to open a crate for a player if they have a key.'
    - '&6/cc forceopen <crate> [player] &f- Opens a crate for a player for free.'
    - '&6/cc tp <location> &f- Teleport to a Crate.'
    - '&6/cc give <physical/virtual> <crate> [amount] [player] &f- Give a player keys for a Chest.'
    - '&6/cc giveall <physical/virtual> <crate> [amount] &f- Gives all online players keys for a Chest.'
    - '&6/cc take <physical/virtual> <crate> [amount] [player] &f- Allows you to take keys from a player.'
    - '&6/cc set <crate> &f- Set a block you are looking at as a crate.'
    - '&6/cc set Menu &f- Set the block you are looking at to open the /cc GUI.'
    - '&6/cc reload &f- Reloads the Config and Data Files.'
    - '&6/cc convert &f- Tries to convert supported plugin''s crate files into crazy crate''s crate files.'
    - '&6/cc set1/set2 &f- Set position #1 or #2 for when making a new schematic for quadcrates. &c1.13+ only'
    - '&6/cc save <schematic file name> &f- Save the new schematic file to the schematics folder. &c1.13+ only'
    - '&fList of permissions can be found here: &ahttps://github.com/badbones69/Crazy-Crates/wiki/Commands-and-Permissions'