# Create customized commands.
enchantment-info:
  enabled: false
  command: /encantar
  permission: ''
  message:
  - '&7Information about &e%enchant% &7enchantment.'
  inventory:
    enabled: true
    type: HOPPER
    size: 45
    name: '&e%enchant%&7 information'
    items:
      '0':
        type: STAINED_GLASS_PANE
        id: 15
        force-glow: false
        name: ' '
        lore: []
      '1':
        type: ENCHANTED_BOOK
        id: 0
        force-glow: false
        name: '&7Information about &e%enchant% &7enchantment'
        lore:
        - '&eEnchantment &7� &r%ench-colors%'
        - '&eApplies to &7� &r%applies-to%'
        - '&eMax Level &7� &r%max-lvl%'
        - '&eDescription &7� &r%desc%'
      '2':
        type: STAINED_GLASS_PANE
        id: 15
        force-glow: false
        name: ' '
        lore: []
      '3':
        type: CHEST
        id: 0
        force-glow: false
        name: '&eApplies to &7�'
        lore:
        - '&7%applies-to%'
      '4':
        type: STAINED_GLASS_PANE
        id: 15
        force-glow: false
        name: ' '
        lore: []
enchantments:
  enabled: false
  command: /enchants
  permission: ''
  message:
  - '&7Showing list of all enchantments...'
  mode:
    currentMode: GROUPS
  inventory:
    size: 36
    go-back-item: true
    display-page-number: true
    name: '&7Server Enchantments'
    items:
      '11':
        type: STAINED_GLASS_PANE
        id: 0
        force-glow: false
        group: SIMPLE
        name: '&7All &f&lSimple Enchantments'
        lore:
        - ' &7Click here to &fopen a preview&7 of all'
        - ' &7available &fSimple &7group enchantments!'
      '12':
        type: STAINED_GLASS_PANE
        id: 5
        force-glow: false
        group: UNIQUE
        name: '&7All &a&lUnique Enchantments'
        lore:
        - ' &7Click here to &fopen a preview&7 of all'
        - ' &7available &aUnique &7group enchantments!'
      '13':
        type: STAINED_GLASS_PANE
        id: 3
        force-glow: false
        group: ELITE
        name: '&7All &b&lElite Enchantments &7(Click to open)'
        lore:
        - ' &7Click here to &fopen a preview&7 of all'
        - ' &7available &bElite &7group enchantments!'
      '14':
        type: STAINED_GLASS_PANE
        id: 4
        force-glow: false
        group: ULTIMATE
        name: '&7All &e&lUltimate Enchantments &7(Click to open)'
        lore:
        - ' &7Click here to &fopen a preview&7 of all'
        - ' &7available &eUltimate &7group enchantments!'
      '15':
        type: STAINED_GLASS_PANE
        id: 1
        force-glow: false
        group: LEGENDARY
        name: '&7All &6&lLegendary Enchantments &7(Click to open)'
        lore:
        - ' &7Click here to &fopen a preview&7 of all'
        - ' &7available &6Legendary &7group enchantments!'
      '22':
        type: STAINED_GLASS_PANE
        id: 14
        force-glow: false
        group: HEROIC
        name: '&7All &4&lHeroic Enchantments &7(Click to open)'
        lore:
        - ' &7Click here to &fopen a preview&7 of all'
        - ' &7available &4Heroic &7group enchantments!'
      fill:
        type: STAINED_GLASS_PANE
        id: 15
        force-glow: false
        name: ' '
        lore: []
  group-enchantment-inventory:
    name: '%color%%group%&7 Enchantments'
    fill-item:
      material: STAINED_GLASS_PANE
      id: 15
      name: ' '
      lore: []
      custom-model-data: 0
    previous-page:
      material: STAINED_GLASS_PANE
      id: 14
      name: '&cPrevious Page.'
      lore: []
      slot: '%invSize% - 3'
      custom-model-data: 0
    next-page:
      material: STAINED_GLASS_PANE
      id: 5
      name: '&aNext Page.'
      lore: []
      slot: '%invSize% - 2'
      custom-model-data: 0
    item:
      type: ENCHANTED_BOOK
      id: 0
      force-glow: false
      command: /enchant %enchantment%
      name: '&e%enchant% &7enchantment'
      lore:
      - '&7'
      - '&d&lINFORMACION:'
      - '&7'
      - '&7Encantamiento: &d%ench-colors%'
      - '&7Nivel maximo: &d%max-lvl-roman%'
