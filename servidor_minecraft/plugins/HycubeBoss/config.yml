Settings:
  HookIntoStackMob: false
  DisableEndermanBossTeleport: true
  DisablePotionsAffectingBosses: true

  KillAll:
    onCommand: true
    onRestart: true

  BroadcastRange:
    onSpawn: -1
    onDeath: -1

  KilledMessage:
    amountOfPlayers: 6

  ActionBar:
    enabled: true
    healthMessage: '&6&l⚔ {boss} &7| &c{current}&f/&a{max} &4&l❤'
    radius: 100

  SpawnRegions:
    useWarzone: false
    useRegions: false
    spawnRegions:
    - 'asdasd'

    ASkyBlock:
      enabled: false
      onOwnIslandOnly: false

  BlockedRegions:
    enabled: false
    blockedRegions:
    - 'blocked_region1'
    - 'blocked_region2'

  BlockedWorlds:
    enabled: false
    blockedWorlds:
    - 'NoPvP'
    - 'world'
    - 'world_nether'
    - 'world_the_end'

  Skills:
    minionCount: 10
    maxMinionsPerBoss: 20
    disableBlockBreakInCage: true

  broadcastOnSpawnCommand: true

